<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر</title>
<meta name="description" content="Sara Shop — مكياج وعناية بالبشرة مع توصيل لجميع المحافظات">
<meta name="theme-color" content="#a4506f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#a4506f; --brand-d:#5e2a42; --brand-l:#fbeef3;
  --gold:#b8862b; --gold-l:#f6edd6;
  --bg:#fff8fa; --surface:#fff; --line:#f3e3ea; --text:#2a1820; --muted:#86707a;
  --red:#c0392b; --green:#1e8a5a; --blue:#2563a8; --amber:#b7791f; --wa:#22b455;
  --r:12px; --sh:0 1px 2px rgba(10,40,45,.05),0 6px 22px rgba(10,40,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:.95rem;color:var(--text)}
svg{flex-shrink:0;vertical-align:middle}
.wrap{width:min(1200px,92%);margin-inline:auto}
.ltr{direction:ltr;unicode-bidi:plaintext}

/* ---------- buttons / fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:600;font-size:.95rem;transition:.18s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,#c06a8c,#a4506f);color:#fff}.btn-p:hover{background:linear-gradient(135deg,#a4506f,#7f3a56)}
.btn-g{background:var(--gold);color:#fff}.btn-g:hover{filter:brightness(.92)}
.btn-o{background:#fff;border:1px solid var(--line)}.btn-o:hover{border-color:var(--brand);color:var(--brand)}
.btn-d{background:#fdeceb;color:var(--red)}.btn-d:hover{background:#fadbd8}
.btn-wa{background:var(--wa);color:#fff;padding:14px 22px;font-size:1.05rem;width:100%}.btn-wa:hover{filter:brightness(.92)}
.btn-sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn-ic{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:#fff}
.btn-ic:hover{border-color:var(--brand);color:var(--brand)}
.btn-ic.del:hover{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(164,80,111,.18)}
.field textarea{min-height:100px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2 .full{grid-column:1/-1}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:22px}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:#3b1226;color:#fff;padding:11px 22px;border-radius:10px;z-index:300;transition:.3s;font-weight:500;display:flex;gap:8px;align-items:center}
.toast.show{transform:translate(-50%,0)}

/* ---------- storefront ---------- */
.ann{background:linear-gradient(90deg,#5e2a42,#a4506f 50%,#5e2a42);color:#f7d5e4;font-size:.82rem;text-align:center;padding:7px 10px}
.ann b{color:#e8cd8a;font-weight:600}
.hdr{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.hdr .in{display:flex;align-items:center;gap:22px;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;color:var(--brand)}
.logo span{font-family:'Playfair Display','IBM Plex Sans Arabic',serif;letter-spacing:.3px;font-weight:600;font-size:1.45rem}
.hphone{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--brand);direction:ltr;padding:8px 4px}
.hphone:hover{color:var(--brand-d)}
.lgimg{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#e8cd8a;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1.1rem}
.hsearch{flex:1;max-width:520px;position:relative}
.hsearch input{width:100%;padding:11px 44px 11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.hsearch input:focus{background:#fff;border-color:var(--brand)}
.hsearch svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cartlink{position:relative;display:flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.cartlink:hover{border-color:var(--brand);color:var(--brand)}
.cartlink .n{background:var(--gold);color:#fff;min-width:20px;height:20px;border-radius:10px;font-size:.75rem;display:grid;place-items:center;padding:0 5px}
.catnav{background:#fff;border-bottom:1px solid var(--line)}
.catnav .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.catnav a{padding:12px 16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.catnav a:hover{color:var(--brand)}
.catnav a.on{color:var(--brand);border-color:var(--gold);font-weight:700}

.hero{position:relative;margin:22px 0;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#fde9f0 0%,#f9d6e3 45%,#f0bbd0 100%);border:1px solid #f3d3df;display:grid;min-height:460px}
.hero::before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;border:64px solid rgba(255,255,255,.5);inset-inline-start:-160px;bottom:-230px}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%);inset-inline-end:28%;top:-60px}
.slide{grid-area:1/1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;padding:48px 76px 56px;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s;position:relative;z-index:1}
.slide.on{opacity:1;visibility:visible}
.stxt>*{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.slide.on .stxt>*{opacity:1;transform:none}
.slide.on .stxt>*:nth-child(2){transition-delay:.12s}.slide.on .stxt>*:nth-child(3){transition-delay:.22s}.slide.on .stxt>*:nth-child(4){transition-delay:.32s}.slide.on .stxt>*:nth-child(5){transition-delay:.42s}
.eyebrow{display:inline-block;background:rgba(255,255,255,.75);color:var(--brand);padding:3px 16px;border-radius:20px;font-size:.8rem;font-weight:600;margin-bottom:14px;border:1px solid rgba(164,80,111,.15)}
.stxt h1{font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.3;margin-bottom:10px;color:var(--brand-d)}
.stxt p{color:#7a5266;max-width:440px;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}.hp b{font-size:1.7rem;color:var(--brand)}.hp s{color:var(--muted)}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.sart{justify-self:center;display:block;width:min(340px,100%);aspect-ratio:4/5;border-radius:200px 200px 26px 26px;overflow:hidden;border:6px solid rgba(255,255,255,.95);box-shadow:0 28px 60px rgba(94,42,66,.25);background:#fff;transform:scale(.93);transition:transform 1.2s ease}
.slide.on .sart{transform:scale(1)}
.sart img{width:100%;height:100%;object-fit:cover}
.harr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--brand);z-index:3;box-shadow:0 6px 18px rgba(94,42,66,.18);transition:.2s}
.harr:hover{background:var(--brand);color:#fff}.harr.pv{right:16px}.harr.nx{left:16px}
.hdots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.hdot{width:38px;height:5px;border-radius:5px;background:rgba(94,42,66,.18);position:relative;overflow:hidden;padding:0}
.hdot::after{content:"";position:absolute;inset:0;background:var(--brand);transform-origin:right;transform:scaleX(0)}
.hdot.on::after{animation:hfill 5.5s linear forwards}
@keyframes hfill{to{transform:scaleX(1)}}
.hero:hover .hdot.on::after,.hero.paused .hdot.on::after{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.hdot.on::after{animation:none;transform:scaleX(1)}.slide,.stxt>*,.sart{transition:none}}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.ctile{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;transition:.2s}
.ctile:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:#e8c3d1}
.ctile img{width:84px;height:84px;border-radius:12px;object-fit:cover}
.ctile b{display:block;font-size:1.1rem}.ctile span{color:var(--muted);font-size:.85rem}
.ctile .ar{margin-inline-start:auto;color:var(--brand);padding-inline:8px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
.feat{display:flex;gap:14px;align-items:center;padding:16px 18px}
.feat .i{width:44px;height:44px;border-radius:11px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center}
.feat b{display:block;font-size:.95rem}.feat span{font-size:.82rem;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.sec-h h2{font-size:1.3rem}
.sec-h select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin-bottom:50px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.pc{animation:up .5s ease both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pc:hover{box-shadow:0 14px 34px rgba(94,42,66,.12);border-color:#e8c3d1;transform:translateY(-3px)}
.pc .qa{position:absolute;bottom:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;box-shadow:0 6px 16px rgba(94,42,66,.2);opacity:0;transform:translateY(8px);transition:.25s}
.pc:hover .qa,.pc .qa:focus-visible{opacity:1;transform:none}
.pc .qa:hover{background:var(--brand);color:#fff}
@media(hover:none){.pc .qa{opacity:1;transform:none}}
.imw{position:relative}
.pc .im{aspect-ratio:1;background:#f9eaf0;position:relative;overflow:hidden;display:block}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:.4s}
.pc:hover .im img{transform:scale(1.05)}
.bdg{position:absolute;top:10px;inset-inline-start:10px;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--red);color:#fff}
.bdg.out{background:#444}.bdg.low{background:var(--amber)}
.pc .bd{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .c{font-size:.78rem;color:var(--gold);font-weight:600}
.pc h3{font-size:.98rem;font-weight:600;line-height:1.45;min-height:2.9em}
.pc .pr{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}
.pc .pr b{font-size:1.1rem;color:var(--brand)}
.pc .pr s{font-size:.82rem;color:var(--muted)}
.pc .btn{margin-top:auto}
.emptyst{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}

.crumbs{padding:18px 0;color:var(--muted);font-size:.88rem;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{color:var(--brand)}
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;margin-bottom:44px}
.gal .mn{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#f9eaf0;border:1px solid var(--line)}
.gal .mn img{width:100%;height:100%;object-fit:cover}
.gal .th{display:flex;gap:10px;margin-top:10px}
.gal .th img{width:68px;height:68px;border-radius:10px;object-fit:cover;border:2px solid var(--line);cursor:pointer}
.gal .th img.on{border-color:var(--brand)}
.pdp h1{font-size:1.7rem;line-height:1.4;margin:4px 0 12px}
.pdp .price{font-size:1.9rem;font-weight:700;color:var(--brand)}
.pdp .price s{font-size:1rem;color:var(--muted);font-weight:400;margin-inline-start:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;padding:14px;background:var(--bg);border-radius:10px;font-size:.88rem}
.meta span{color:var(--muted)}
.stk{font-weight:600}.stk.ok{color:var(--green)}.stk.lo{color:var(--amber)}.stk.no{color:var(--red)}
.desc{color:#5a4048;white-space:pre-line;margin-bottom:22px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff}
.qty button{width:36px;height:40px;font-size:1.15rem;color:var(--brand)}
.qty button:hover{background:var(--bg)}
.qty span{min-width:34px;text-align:center;font-weight:700}

.steps{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.steps .s i{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700}
.steps .s.on{color:var(--brand);font-weight:700}.steps .s.on i{background:var(--brand);color:#fff}
.steps .s.dn i{background:var(--green);color:#fff}
.steps .ln{width:46px;height:2px;background:var(--line)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start;margin-bottom:56px}
.crow{display:grid;grid-template-columns:76px 1fr auto auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border:none}
.crow img{width:76px;height:76px;border-radius:10px;object-fit:cover}
.sl{display:flex;justify-content:space-between;padding:7px 0}
.sl.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;font-size:1.2rem;font-weight:700;color:var(--brand)}
.h3{font-size:1.05rem;font-weight:700;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.h3 i{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.8rem}
.mc{background:linear-gradient(135deg,#2b1a25,#4a2840 60%,#6b3a58);color:#fff;border-radius:16px;padding:22px;position:relative;overflow:hidden;margin-bottom:16px;min-height:178px}
.mc .c1,.mc .c2{position:absolute;width:104px;height:104px;border-radius:50%;top:18px;inset-inline-end:22px}
.mc .c1{background:#eb001b;opacity:.9}
.mc .c2{background:#f79e1b;opacity:.85;inset-inline-end:62px;mix-blend-mode:screen}
.mc small{display:block;color:#aab4c6;font-size:.78rem;position:relative}
.mc .num{font-size:1.3rem;letter-spacing:2.5px;font-weight:600;margin:46px 0 14px;position:relative;direction:ltr;text-align:right;word-break:break-all}
.mc .row{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.mc .cp{background:rgba(255,255,255,.14);padding:6px 14px;border-radius:8px;font-size:.82rem;display:flex;gap:6px;align-items:center}
.mc .cp:hover{background:rgba(255,255,255,.26)}
.how{list-style:none;counter-reset:x}
.how li{counter-increment:x;position:relative;padding:5px 38px 5px 0;color:#6b4a58;font-size:.92rem}
.how li::before{content:counter(x);position:absolute;right:0;top:5px;width:25px;height:25px;border-radius:50%;background:var(--gold-l);color:var(--gold);font-weight:700;display:grid;place-items:center;font-size:.8rem}

.ftr{background:linear-gradient(180deg,#7a3856,#5e2a42);color:#efc3d6;padding:42px 0 18px;margin-top:20px}
.ftr .cols{display:grid;grid-template-columns:1.5fr 1fr 1.1fr 1.2fr;gap:30px;margin-bottom:28px}
.ftr h4{color:#fff;margin-bottom:12px;font-size:1rem}
.ftr p,.ftr a{font-size:.9rem;display:block;margin-bottom:6px}
.ftr a:hover{color:#e8cd8a}
.ftr .cp{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;text-align:center;font-size:.82rem;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

.fdb{background:var(--brand-l);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.86rem;color:var(--brand-d)}
.fdb .bar{height:6px;border-radius:6px;background:#fff;margin-top:8px;overflow:hidden}
.fdb .bar i{display:block;height:100%;background:linear-gradient(90deg,#c06a8c,#b8862b);border-radius:6px;transition:width .4s}
.fdb.ok{display:flex;gap:8px;align-items:center;color:var(--green);background:#e8f6ee;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 6px}
.trust div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.8rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.trust svg{color:var(--brand)}
details.acc{border-top:1px solid var(--line);padding:4px 0}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:1.3rem;color:var(--brand);transition:.2s}
details.acc[open] summary::after{content:"−"}
details.acc p{color:#6b4a58;font-size:.9rem;padding-bottom:12px}
.flogo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.flogo b{font-family:'Playfair Display',serif;font-size:1.35rem;color:#fff;font-weight:600}
.ftr .lgimg{width:52px;height:52px}
.ftr .ph{direction:ltr;text-align:right;font-weight:600;color:#fff;font-size:1rem}
.fab{position:fixed;z-index:70;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:.25s;left:20px}
.fab.wa{bottom:20px;background:var(--wa)}.fab.wa:hover{transform:scale(1.07)}
.fab.up{bottom:82px;background:#fff;color:var(--brand);border:1px solid var(--line);opacity:0;pointer-events:none;transform:translateY(10px)}
.fab.up.show{opacity:1;pointer-events:auto;transform:none}
::selection{background:#f3c6d8;color:var(--brand-d)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#e3bccb;border-radius:10px}::-webkit-scrollbar-track{background:var(--bg)}

/* ---------- admin ---------- */
#adminRoot{display:none;min-height:100vh}
.alog{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-d),var(--brand));padding:20px}
.alog .box{width:min(400px,100%);padding:34px}
.alog .lg{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#e8cd8a;display:grid;place-items:center;margin:0 auto 14px}
.adm{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#6b3350,#4e2037);color:#f3cbdc;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:4px 10px 22px}
.side .lgimg{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff}
.logo i{background:var(--gold);color:#fff}
.side button,.side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:500;text-align:right;width:100%;transition:.15s}
.side button:hover,.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side button.on{background:rgba(255,255,255,.12);color:#fff}
.side .nb{margin-inline-start:auto;background:var(--gold);color:#fff;font-size:.72rem;border-radius:10px;padding:1px 8px}
.side .sp{flex:1}
.amain{padding:26px 30px 60px;min-width:0}
.atop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.atop h1{font-size:1.45rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:18px;display:flex;gap:14px;align-items:center}
.kpi .i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.kpi b{font-size:1.4rem;display:block;line-height:1.2}
.kpi span{font-size:.82rem;color:var(--muted)}
.i-g{background:#e4f4ec;color:var(--green)}.i-b{background:#e3edf9;color:var(--blue)}.i-a{background:#fbf0dc;color:var(--amber)}.i-r{background:#fbe6e4;color:var(--red)}
.dgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:42px;background:linear-gradient(#c9748f,#f0b9cc);border-radius:7px 7px 0 0;min-height:3px}
.chart small{font-size:.72rem;color:var(--muted)}
.chart .v{font-size:.7rem;color:var(--brand);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#fbeff4;font-size:.8rem;color:var(--muted);font-weight:600;text-align:right;padding:11px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);text-align:right;vertical-align:middle;font-size:.9rem}
tr:hover td{background:#fffafc}
td .pi{display:flex;gap:12px;align-items:center}
td .pi img{width:46px;height:46px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
td .pi small{display:block;color:var(--muted);font-size:.76rem}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input,.tools select{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.tools input{flex:1;min-width:200px}
.st{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.78rem;font-weight:600;white-space:nowrap}
.s-new{background:#fbf0dc;color:var(--amber)}.s-paid{background:#e3edf9;color:var(--blue)}.s-ship{background:#ece6f8;color:#6a3fb0}.s-done{background:#e4f4ec;color:var(--green)}.s-cancel{background:#fbe6e4;color:var(--red)}
.sw{position:relative;width:38px;height:22px;display:inline-block}
.sw input{display:none}.sw i{position:absolute;inset:0;background:#e6d3db;border-radius:20px;transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}
.sw input:checked+i{background:var(--brand)}.sw input:checked+i::after{right:19px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchips button{padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:.85rem;font-weight:500}
.fchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sgrp{margin-bottom:18px}.sgrp h3{font-size:1rem;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}

.modal{position:fixed;inset:0;background:rgba(8,30,33,.55);z-index:200;display:grid;place-items:start center;overflow-y:auto;padding:30px 14px}
.mbox{background:#fff;border-radius:16px;width:min(560px,100%);padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.mbox.wide{width:min(760px,100%)}
.mclose{position:absolute;top:16px;left:16px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.mclose:hover{background:var(--bg)}
.mbox h2{font-size:1.2rem;margin-bottom:18px}
.drop{border:2px dashed #e6c6d4;border-radius:12px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;display:block;transition:.15s}
.drop:hover,.drop.ov{border-color:var(--brand);background:var(--brand-l);color:var(--brand)}
.drop input{display:none}
.pv{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pv .it{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer}
.pv .it.main{border-color:var(--gold)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv .it em{position:absolute;bottom:0;left:0;right:0;background:var(--gold);color:#fff;font-size:.68rem;text-align:center;font-style:normal}
.pv .it button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.mfoot{display:flex;gap:10px;margin-top:10px;justify-content:flex-start;flex-wrap:wrap}
.inv-t{width:100%;margin:12px 0}
.inv-t td,.inv-t th{padding:8px 10px;font-size:.88rem}

@media(max-width:900px){
  .slide{grid-template-columns:1fr;padding:26px 20px 54px;text-align:center;gap:18px}.sart{order:-1;width:min(230px,66%)}.stxt p{margin-inline:auto}.hp,.hbtn{justify-content:center}.harr{display:none}.hero{min-height:0}
  .annx{display:none}.fab{width:46px;height:46px;left:14px}.fab.wa{bottom:14px}.fab.up{bottom:68px}
  .hdr .in{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}.hsearch{display:block;order:3;flex-basis:100%;max-width:none}.hphone{display:none}.cartlink{margin-inline-start:auto}
  .feats{grid-template-columns:1fr}
  .pdp,.two,.dgrid,.ftr .cols{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.side .logo,.side .sp{display:none}.side button,.side a{width:auto;white-space:nowrap}
  .amain{padding:18px 14px 50px}
  .grid2{grid-template-columns:1fr}
  .crow{grid-template-columns:64px 1fr}.crow img{width:64px;height:64px}
}
</style>
</head>

// Async Supabase Sync Engine
async function fetchFromSupabase() {
  try {
    const { data: pData } = await _supabase.from('products').select('*');
    if (pData && pData.length > 0) {
      db.products = pData.map(p => ({
        id: p.id,
        sku: p.sku,
        name: p.name,
        price: p.price,
        oldPrice: p.old_price,
        cat: p.cat,
        desc: p.desc,
        imgs: p.imgs || [art('lip','#f7c3d3','#fde9ef')],
        stock: p.stock,
        on: p.on,
        feat: p.feat,
        ts: p.created_at ? new Date(p.created_at).getTime() : Date.now()
      }));
    }

    const { data: sData } = await _supabase.from('settings').select('*').eq('id', 1).single();
    if (sData) {
      db.settings = { ...db.settings, ...sData.data };
    }

    const { data: oData } = await _supabase.from('orders').select('*').order('created_at', { ascending: false });
    if (oData) {
      db.orders = oData.map(o => ({ ...o.order_data, id: o.id, status: o.status, date: o.created_at }));
    }
  } catch(e) {
    console.warn('Supabase sync warning:', e);
  }
}

async function syncProductToSupabase(p) {
  try {
    await _supabase.from('products').upsert({
      id: p.id,
      sku: p.sku,
      name: p.name,
      price: p.price,
      old_price: p.oldPrice || 0,
      cat: p.cat,
      desc: p.desc,
      imgs: p.imgs,
      stock: p.stock,
      on: p.on,
      feat: p.feat !== false
    });
  } catch(e){}
}

async function syncOrderToSupabase(o) {
  try {
    await _supabase.from('orders').upsert({
      id: o.id,
      status: o.status,
      order_data: o
    });
  } catch(e){}
}

async function syncSettingsToSupabase(s) {
  try {
    await _supabase.from('settings').upsert({
      id: 1,
      data: s
    });
  } catch(e){}
}

async function pDel(id){
  if(confirm('حذف هذا المنتج نهائياً؟')){
    db.products=db.products.filter(p=>p.id!==id);
    save();
    try { await _supabase.from('products').delete().eq('id', id); } catch(e){}
    aProducts();
    toast('تم حذف المنتج');
  }
}

  const draw=()=>{$('#pv').innerHTML=tmp.map((s,i)=>`<div class="it ${i?'':'main'}" onclick="tmp.unshift(tmp.splice(${i},1)[0]);window._dp()"><img src="${s}">${i?'':'<em>رئيسية</em>'}<button onclick="event.stopPropagation();tmp.splice(${i},1);window._dp()">${ic('x',12)}</button></div>`).join('')};
  window._dp=draw;draw();
  const isPh=x=>x.startsWith('data:image/svg+xml');
  const add=async fs=>{

  const dz=$('#dz');['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('ov')}));

    save();
    syncProductToSupabase(target);
    closeModal();aProducts();toast(ic('check',16)+' تم حفظ المنتج');
  };

function shrink(file,max=900){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

  $('#osv').onclick=async ()=>{const n=$('#os').value,old=o.status;
    if(n==='cancel'&&old!=='cancel')o.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock+=i.qty;syncProductToSupabase(p);}});
    if(old==='cancel'&&n!=='cancel')o.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock=Math.max(0,p.stock-i.qty);syncProductToSupabase(p);}});
    o.status=n;save();syncOrderToSupabase(o);closeModal();renderAdmin();toast('تم تحديث الحالة')};
}
async function oDel(id){
  if(confirm('حذف الطلب نهائياً؟')){
    db.orders=db.orders.filter(o=>o.id!==id);
    save();
    try { await _supabase.from('orders').delete().eq('id', id); } catch(e){}
    closeModal();renderAdmin();
  }
}
function invoice(id){
  const o=db.orders.find(x=>x.id===id),w=window.open('','_blank');if(!w)return toast('اسمح بالنوافذ المنبثقة');
  w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${o.id}</title><style>body{font-family:Tahoma,Arial;padding:30px;color:#111}h1{margin:0}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{border:1px solid #ccc;padding:8px;text-align:right}th{background:#f1f1f1}.t{font-size:1.2rem;font-weight:bold}</style></head><body>
  <img src="${LOGO}" style="width:80px;height:80px"><h1>${esc(db.settings.store)}</h1><p>فاتورة رقم: <b>${o.id}</b> — ${new Date(o.date).toLocaleDateString('ar-IQ')}</p>
  <p>الزبون: ${esc(o.name)}<br>الهاتف: ${esc(o.phone)}<br>العنوان: ${esc(o.addr)}</p>
  <table><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>المجموع</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${fmt(i.price)}</td><td>${i.qty}</td><td>${fmt(i.price*i.qty)}</td></tr>`).join('')}</table>
  <p>المجموع: ${fmt(o.sub)}<br>التوصيل: ${o.ship?fmt(o.ship):'مجاني'}</p><p class="t">الإجمالي: ${fmt(o.total)}</p><p>شكراً لتسوقكم معنا</p><script>onload=()=>print()<\/script></body></html>`);w.document.close();
}

function aSettings(){
  const s=db.settings,f=(id,l,v,x='',h='')=>`<div class="field"><label>${l}</label><input id="${id}" value="${esc(v)}" ${x}>${h?`<div class="hint">${h}</div>`:''}</div>`;
  $('#ac').innerHTML=pageTop('الإعدادات',`<button class="btn btn-g" id="ss">${ic('check',17)} حفظ كل الإعدادات</button>`)+`
  <div class="box pad sgrp"><h3>معلومات المتجر</h3><div class="grid2">${f('s1','اسم المتجر',s.store)}${f('s2','العملة',s.currency)}${f('s3','الشعار / الوصف القصير',s.tagline)}${f('s4','نص الشريط العلوي',s.ann)}</div></div>
  <div class="box pad sgrp"><h3>الدفع والتواصل</h3><div class="grid2">${f('s5','رقم حساب الماستر كارد',s.card,'class="ltr"')}${f('s6','اسم صاحب الحساب',s.holder)}${f('s7','رقم الواتساب (مع رمز الدولة)',s.whatsapp,'class="ltr"','مثال العراق: 9647701234567')}</div></div>
  <div class="box pad sgrp"><h3>التوصيل</h3><div class="grid2">${f('s8','سعر التوصيل',s.shipping,'type="number"')}${f('s9','توصيل مجاني للطلبات فوق',s.freeAbove,'type="number"','ضع 0 لتعطيل التوصيل المجاني')}</div></div>
  <div class="box pad sgrp"><h3>الأمان والبيانات</h3><div class="grid2">${f('s10','كلمة مرور الإدارة',s.adminPass)}</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-o" onclick="bk()">${ic('down',17)} نسخة احتياطية</button>
   <label class="btn btn-o" style="cursor:pointer">${ic('up',17)} استرجاع نسخة<input type="file" accept=".json" hidden onchange="rs(this)"></label>
   <button class="btn btn-d" onclick="clrDemo()">حذف المنتجات التجريبية</button></div>
   <p class="hint" style="margin-top:10px">البيانات تُحفظ في قاعدة البيانات الحية (Supabase) وكذلك محلياً.</p></div>`;
  $('#ss').onclick=async ()=>{const g=i=>$('#'+i).value.trim();
    Object.assign(s,{store:g('s1')||'المتجر',currency:g('s2')||'د.ع',tagline:g('s3'),ann:g('s4'),card:g('s5'),holder:g('s6'),whatsapp:g('s7'),shipping:+g('s8')||0,freeAbove:+g('s9')||0,adminPass:g('s10')||'admin123'});
    save();await syncSettingsToSupabase(s);renderAdmin();toast(ic('check',16)+' تم حفظ الإعدادات')};
}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='store-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.settings)throw 0;db=d;save();renderAdmin();toast('تم استرجاع النسخة')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function clrDemo(){if(confirm('حذف المنتجات التجريبية؟')){db.products=db.products.filter(p=>!p.demo);save();renderAdmin()}}

route();
</script>
</body>
</html>
